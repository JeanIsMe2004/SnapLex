<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#FBF5E6;--cd:#fff;--ink:#1E2A5E;--mu:#6B7196;--lv:#DAD5F8;--lv2:#9A90E8;--ok:#2F9E77;--no:#D9534F;--ln:#E7E0CC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B3D;--cd:#1F2856;--ink:#F5EFDD;--mu:#A5A9CC;--lv:#2E3874;--lv2:#B9B2F0;--ln:#2E3874}}
:root[data-theme="dark"]{--bg:#141B3D;--cd:#1F2856;--ink:#F5EFDD;--mu:#A5A9CC;--lv:#2E3874;--lv2:#B9B2F0;--ln:#2E3874}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Prompt,'Noto Sans Thai',system-ui,sans-serif}
#app{max-width:480px;margin:auto;padding:16px 16px 120px}
button{font:inherit}button:focus-visible,textarea:focus-visible{outline:3px solid var(--lv2);outline-offset:2px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);margin:10px 0}
.btn.big{padding:18px;font-size:17px;border-radius:20px}.ghost{background:var(--lv);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .btn{margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:38px;font-weight:800;letter-spacing:-.03em}
.l1{fill:var(--lv2)}.l2{fill:var(--ink)}.l3{fill:var(--bg)}
.tag{color:var(--mu);margin:2px 0 14px}.mu{color:var(--mu)}h3{margin:18px 0 4px}
.pb{height:10px;border-radius:9px;background:var(--lv);margin:10px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--ink);border-radius:9px}
.badge{display:inline-block;background:var(--lv);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.mini{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.ex{background:var(--lv);border-radius:14px;padding:10px 12px;margin:8px 0}
.wd{font-size:32px;font-weight:700;letter-spacing:-.02em}
.ic{background:var(--lv);color:var(--ink);border:0;border-radius:99px;padding:6px 12px;cursor:pointer}
.bar{display:flex;align-items:center;gap:10px;margin:4px 0 8px}.bar h2{font-size:20px}
.prev{height:200px;border-radius:24px;background:var(--lv);display:grid;place-items:center;overflow:hidden;margin:8px 0}.prev img{width:100%;height:100%;object-fit:cover}.em{font-size:72px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chip{border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{text-align:center}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.th{border:2px solid transparent;background:var(--cd);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;color:var(--ink);text-align:center}.th svg{display:block;width:100%;aspect-ratio:4/3}.th span{display:block;font-size:11px;padding:4px 2px;line-height:1.2}.th.on{border-color:var(--ink)}.prev svg{width:100%;height:100%}
.ld{text-align:center;padding:90px 0}.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--lv);border-top-color:var(--ink);margin:0 auto 20px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.fc{min-height:250px;display:grid;place-content:center;text-align:center;gap:8px;cursor:pointer;background:var(--lv)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:16px;padding:13px 14px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
textarea{width:100%;border-radius:14px;border:1px solid var(--ln);padding:10px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:8px}
.av{width:48px;height:48px;border-radius:50%;background:var(--lv);display:grid;place-items:center;font-weight:700;margin-right:12px}
.big2{font-size:28px;font-weight:700}
.ch{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:10px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px}.col i{width:100%;background:var(--ink);border-radius:8px 8px 4px 4px;min-height:3px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--cd);border-top:1px solid var(--ln);border-radius:24px 24px 0 0;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav .on{color:var(--ink);font-weight:700}nav span{font-size:20px}
nav .cam span{background:var(--ink);border-radius:50%;width:50px;height:50px;display:grid;place-items:center;margin-top:-26px;font-size:22px}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

+(ed?'<div class="card"><textarea id="ta" rows="3" placeholder="แต่งประโยคด้วยคำว่า '+w.w+'">'+esc(C.mv||'')+'</textarea><button class="btn" onclick="mine('+i+')">ตรวจด้วย AI และบันทึก</button><p id="fb" class="mu"></p></div>':'')+CKH(i)
+'<div class="grid2"><button class="btn '+(r?'ghost':'')+'" onclick="sv('+i+')">'+(r?'✓ บันทึกแล้ว':'บันทึกคำศัพท์')+'</button><button class="btn ghost" onclick="ed=1;render(1)">✍ สร้างประโยคของฉัน</button></div>'},
vocab(){const a=ids().filter(i=>!lv||W[i].l==lv),tb='<div class="chips" style="margin:0 0 8px"><button class="chip'+(lib?'':' on')+'" onclick="lib=0;render()">ของฉัน ('+ids().length+')</button><button class="chip'+(lib?' on':'')+'" onclick="lib=1;render()">คลังทั้งหมด ('+W.length+')</button></div><div class="chips" style="margin:0 0 6px">'+LT.map((t,x)=>'<button class="chip'+(lv==x?' on':'')+'" onclick="lv='+x+';render()">'+t+'</button>').join('')+'</div>';
const grp=arr=>[1,2,3].filter(g=>!lv||lv==g).map(g=>{const q=arr.filter(i=>W[i].l==g);return q.length?'<h3>'+LT[g]+' ('+q.length+' คำ)</h3>'+q.map(mini).join(''):''}).join('');
return head('คำศัพท์')+tb+(lib?grp([...W.keys()]):a.length?grp(a):'<div class="card">ยังไม่มีคำที่บันทึกในระดับนี้ ดูคลังทั้งหมด หรือถ่ายรูปเพื่อสะสมคำศัพท์<button class="btn" onclick="nav(\'cam\')">📷 ถ่ายรูป</button></div>')},
review(){return head('ทบทวน')+'<div class="card"><h3 style="margin:0">🃏 Flashcard</h3><p class="mu">'+due().length+' คำถึงเวลาทบทวนแล้ว</p><button class="btn" onclick="startF()">เริ่มทบทวน</button></div><div class="card"><h3 style="margin:0">📝 Quiz</h3><p class="mu">เลือกคำตอบและเติมคำในประโยค 5 ข้อ</p><button class="btn" onclick="startQ()">ทำแบบทดสอบ</button></div><p class="mu">Spaced Repetition: จำได้ ระบบจะเว้นระยะนานขึ้น ตอบผิดหรือยังไม่แม่น คำนั้นจะกลับมาเร็วขึ้น</p>'},
flash(){if(!F.q.length)return bar('Flashcard')+'<div class="card" style="text-align:center"><div style="font-size:48px">🎉</div><h2>ทบทวนครบแล้ว</h2><p class="mu">'+(F.n?'คำที่ยังไม่แม่นจะกลับมาให้ทบทวนบ่อยขึ้น':'ตอนนี้ยังไม่มีคำที่ถึงเวลาทบทวน')+'</p></div><button class="btn ghost" onclick="startF(1,1)">ทบทวนทุกคำอีกรอบ</button><button class="btn" onclick="nav(\'me\')">ดูพัฒนาการ</button>';
const i=F.q[0],w=W[i];return bar('Flashcard')+'<p class="mu">เหลืออีก '+F.q.length+' คำ</p><div class="card fc" onclick="F.f=!F.f;render(1)">'+(F.f?'<span class="badge" style="justify-self:center">'+w.t+'</span><h2>'+w.m+'</h2><p class="mu">'+w.s+'</p><div class="ex">'+w.e+'</div>':'<h1 class="wd">'+w.w+'</h1><p class="mu">'+w.p+'</p><button class="ic" style="justify-self:center" onclick="event.stopPropagation();speak('+i+')">🔊</button><p class="mu">แตะเพื่อพลิกดูความหมาย</p>')+'</div><div class="grid2"><button class="btn ghost" onclick="rate(0)">ยังไม่แม่น</button><button class="btn" onclick="rate(1)">จำได้แล้ว</button></div>'},
quiz(){if(!Q.l||!Q.l.length)return bar('Quiz')+'<div class="card">ต้องมีคำศัพท์ที่บันทึกไว้อย่างน้อย 1 คำ<button class="btn" onclick="nav(\'cam\')">📷 ถ่ายรูป</button></div>';
if(Q.k>=Q.l.length)return bar('ผลคะแนน')+'<div class="card" style="text-align:center"><div class="big2" style="font-size:56px">'+Q.s+'/'+Q.l.length+'</div><p>'+(Q.s==Q.l.length?'เต็มทุกข้อ เยี่ยมมาก!':Q.s>=Q.l.length/2?'ทำได้ดี ทบทวนอีกนิดจะแม่นขึ้น':'ไม่เป็นไร คำที่พลาดจะกลับมาให้ทบทวนเร็วขึ้น')+'</p></div><button class="btn" onclick="startQ()">ทำอีกครั้ง</button><button class="btn ghost" onclick="nav(\'me\')">ดูพัฒนาการ</button>';
const q=Q.l[Q.k],w=W[q.i],a=Q.p!=null;
return bar('Quiz ข้อ '+(Q.k+1)+'/'+Q.l.length)+'<div class="card">'+(q.f?'เติมคำในประโยค<div class="ex">'+w.e.replace(new RegExp(w.w,'i'),'_____')+'</div><p class="mu">'+w.x+'</p>':'คำว่า <h1 class="wd">'+w.w+'</h1>แปลว่าอะไร')+'</div>'
+q.o.map(o=>'<button class="opt '+(a?(o==q.i?'ok':o==Q.p?'no':''):'')+'" '+(a?'disabled':'')+' onclick="ans('+o+')">'+(q.f?W[o].w:W[o].m)+'</button>').join('')
+(a?'<button class="btn" onclick="Q.k++;Q.p=null;render()">'+(Q.k+1<Q.l.length?'ข้อถัดไป':'ดูคะแนน')+'</button>':'')},
me(){const t=ids().length,k=known(),ds=[6,5,4,3,2,1,0].map(a=>D-a),cs=ds.map(d=>ids().filter(i=>S[i].t==d).length),m=Math.max(1,...cs),th=['อา','จ','อ','พ','พฤ','ศ','ส'];
const cat=[...new Set(SC.map(s=>s.c))].map(c=>[c,ids().filter(i=>W[i].c==c).length]).sort((a,b)=>b[1]-a[1]),cm=Math.max(1,cat[0][1]);
const st=(l,v)=>'<div class="card" style="margin:0"><div class="mu">'+l+'</div><div class="big2">'+v+'</div></div>';
return head('โปรไฟล์และสถิติ')+'<div class="card row" style="justify-content:flex-start"><div class="av">ส</div><div><b>ผู้เรียน SnapLex</b><div class="mu">เป้าหมาย: คำศัพท์ภาษาอังกฤษระดับสูง</div></div></div>'
+'<div class="grid2">'+st('คำทั้งหมด',t)+st('คำที่จำได้',k)+st('อัตราการจำ',(t?Math.round(k/t*100):0)+'%')+st('เรียนต่อเนื่อง',streak()+' วัน')+'</div>'
+'<div class="card"><b>พัฒนาการ 7 วันล่าสุด</b><div class="mu">คำใหม่ที่บันทึกต่อวัน</div><div class="ch">'+cs.map((c,x)=>'<div class="col">'+c+'<i style="height:'+c/m*80+'%"></i>'+th[new Date(ds[x]*864e5).getDay()]+'</div>').join('')+'</div></div>'
+'<div class="card"><b>หมวดที่เรียนบ่อย</b>'+cat.map(c=>'<div class="row" style="margin-top:10px"><span>'+c[0]+'</span><span class="mu">'+c[1]+' คำ</span></div><div class="pb" style="margin:4px 0"><i style="width:'+c[1]/cm*100+'%"></i></div>').join('')+'</div>'}
};
const NV=[['home','🏠','Home'],['vocab','📖','คำศัพท์'],['cam','📷','กล้อง'],['review','🔁','ทบทวน'],['me','👤','โปรไฟล์']],
HL={home:'home',vocab:'vocab',detail:'vocab',cam:'cam',live:'cam',load:'cam',result:'cam',review:'review',flash:'review',quiz:'review',me:'me'};
function render(k){const y=scrollY;if(R.v!='live')stopLive();$('app').innerHTML=V[R.v]();$('nav').innerHTML=NV.map(n=>'<button class="'+(HL[R.v]==n[0]?'on ':'')+(n[0]=='cam'?'cam':'')+'" onclick="nav(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>').join('');scrollTo(0,k?y:0)}
function go(v,a){H.push([R.v,R.a]);R={v,a};ed=0;CK=null;render()}
function back(){const p=H.pop()||['home'];R={v:p[0],a:p[1]};ed=0;render()}
function nav(v){H=[];ed=0;if(v=='cam')C={};R={v};render()}
async function file(el){const f=el.files&&el.files[0];el.value='';if(!f)return;try{const b=await small(f),r=new FileReader();r.onload=()=>{C={img:r.result,blob:b};render()};r.onerror=()=>{C={err:'อ่านไฟล์ภาพไม่สำเร็จ ลองเลือกรูปอื่น'};render()};r.readAsDataURL(b)}catch(e){C={err:'เปิดรูปไม่สำเร็จ (รหัส: '+((e&&e.name)||'unknown')+')'};render()}}
async function small(b){try{const bm=await createImageBitmap(b),k=Math.min(1,1024/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(x=>r(x||b),'image/jpeg',.8))}catch(e){return b}}
const viaImg=u=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(x=>x?res(x):rej({code:'image_rejected'}),'image/jpeg',.8)};im.onerror=()=>rej({code:'image_rejected'});im.src=u});
const E={nosample:'หน้านี้ยังเชื่อมต่อ AI ไม่ได้ (ต้องเปิดผ่านหน้า Claude และกดอนุญาต)',noimg:'มุมมองนี้ยังส่งรูปให้ AI ดูไม่ได้ พิมพ์บอกสั้น ๆ ว่าในภาพมีอะไร (ช่องด้านล่าง) แล้วกดวิเคราะห์อีกครั้ง',image_rejected:'AI อ่านไฟล์ภาพนี้ไม่ได้ (รองรับ JPEG, PNG, WebP, GIF) ลองรูปอื่น',not_granted:'ต้องอนุญาตให้ AI วิเคราะห์ภาพก่อน',rate_limited:'ใช้งานถี่เกินไป รอสักครู่แล้วลองใหม่',none:'ไม่พบคำในคลังที่ตรงกับภาพนี้ ลองถ่ายให้เห็นวัตถุหลักชัดขึ้น'};
async function ai(){const sm=window.claude&&await claude.use('sample');if(!sm)throw{code:'nosample'};const lim=await sm.limits().catch(()=>null);const im=lim&&lim.images,txt=(C.dsc||'').trim();if(!im&&!txt)throw{code:'noimg'};let bl;if(im){bl=await small(C.blob);if(im.mediaTypes&&!im.mediaTypes.includes(bl.type))bl=await viaImg(C.img)}
const q=txt.replace(/"/g,"'"),pre=im?'You look at a photo and choose advanced English vocabulary from a fixed library that fits what is truly visible.'+(q?' The viewer adds: "'+q+'".':''):'You cannot see the photo; the viewer describes it as: "'+q+'". Work only from this description and choose advanced English vocabulary from a fixed library that fits the scene described.';
const lib=W.map((w,i)=>i+':'+w.w+' ('+w.m+')').join('; ');
const d=await sm.json(pre+' Library (index:word): '+lib+'. Rules: pick 1-3 words whose meaning clearly matches objects, actions, mood or setting actually visible in the photo; prefer the most specific fit; never pick a word only to fill the count; if nothing fits, return an empty picks array. Reply ONLY JSON: {"scene":"short Thai description of the photo","emoji":"one emoji","objects":["2-5 English nouns seen"],"picks":[{"i":0,"why":"Thai reason, max 14 words, naming what in the photo matches"}]}',(im?{images:bl,modelTier:'quick'}:{modelTier:'quick'}));
const p=(d.picks||[]).filter(x=>W[x.i]).slice(0,3);if(!p.length)throw{code:'none'};
return{w:p.map(x=>x.i),why:Object.fromEntries(p.map(x=>[x.i,x.why])),sc:d.scene||'ภาพของคุณ',e:d.emoji||'📷',o:d.objects||[],ai:im?1:2}}
async function analyze(){const m=['กำลังอ่านภาพ...','มองหาวัตถุและบรรยากาศ...','คัดคำศัพท์ที่ตรงกับภาพ...'];R={v:'load',m:m[0]};render();let n=0;const tk=setInterval(()=>{if(R.v=='load'&&$('lm'))$('lm').textContent=m[++n%3]},1600);
try{if(C.sc!=null){await new Promise(r=>setTimeout(r,1500));const x=SC[C.sc];C.r={w:x.w,sc:x.n,e:x.e,o:[],ai:0}}else C.r=await ai()}
catch(e){clearInterval(tk);if(R.v=='load'){R={v:'cam'};C.err=(E[e&&e.code]||'วิเคราะห์ภาพไม่สำเร็จ ลองใหม่อีกครั้ง')+' (รหัส: '+((e&&e.code)||'unknown')+') หรือเลือกฉากตัวอย่างด้านล่าง';console.error(e);render()}return}
clearInterval(tk);if(R.v!='load')return;R={v:'cam'};go('result')}
function sv(i){if(S[i])delete S[i];else{S[i]={t:D,b:0,d:D};act.add(D)}save();render(1)}
function speak(i){try{const u=new SpeechSynthesisUtterance(W[i].w);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const CKH=i=>CK&&CK.i==i?'<div class="card" style="border-color:var(--no)"><b>'+(CK.err?'ตรวจด้วย AI ไม่สำเร็จ':'ประโยคนี้ยังไม่ถูกต้อง')+'</b><p class="mu">'+esc(CK.d?CK.d.feedback:CK.err)+'</p>'+(CK.d?'<div class="ex">'+esc(CK.d.corrected)+'</div><button class="btn" onclick="fin(CK.i,CK.d.corrected,{score:5,feedback:\'ปรับจากประโยคเดิมของคุณแล้ว\'})">ใช้ประโยคที่แก้แล้วและบันทึก</button>':'')+'<button class="btn ghost" onclick="CK=null;ed=1;render(1)">แก้ประโยคเอง</button>'+(CK.err?'<button class="btn ghost" onclick="fin(CK.i,CK.v,{score:0,feedback:\'\'})">บันทึกโดยไม่ตรวจ</button>':'')+'</div>':'';
function fin(i,v,d){if(!S[i])S[i]={t:D,b:0,d:D};S[i].s=v;S[i].sc=d.score||0;S[i].fb=d.feedback||'';act.add(D);save();ed=0;CK=null;C.mv='';render(1)}
async function mine(i){const v=$('ta').value.trim();if(!v)return;C.mv=v;if(!v.toLowerCase().includes(W[i].w.slice(0,-1))){$('fb').textContent='ประโยคต้องมีคำว่า '+W[i].w;return}
$('fb').textContent='AI กำลังตรวจประโยค...';
try{const sm=window.claude&&await claude.use('sample');if(!sm)throw{code:'nosample'};
const d=await sm.json('You are an English teacher checking a sentence written by a Thai learner who must use the word "'+W[i].w+'" ('+W[i].m+'). Sentence: "'+v.replace(/"/g,"'")+'". Judge grammar, spelling, natural wording, and whether the target word is used correctly in meaning. Reply ONLY JSON: {"ok":true,"corrected":"fully corrected sentence keeping the learner idea and using the target word","feedback":"Thai explanation, max 35 words: say what is wrong, or praise if correct","score":4}  (ok is false when there is any real error; score 1-5)',{modelTier:'quick',cache:false});
if(d.ok===true)fin(i,v,d);else{CK={i,v,d};render(1)}}
catch(e){const m={nosample:'หน้านี้ยังเชื่อมต่อ AI ไม่ได้',not_granted:'ต้องอนุญาตให้ AI ทำงานก่อน',rate_limited:'ใช้งานถี่เกินไป รอสักครู่'};CK={i,v,err:(m[e&&e.code]||'ตรวจไม่สำเร็จ')+' (รหัส: '+((e&&e.code)||'unknown')+')'};render(1)}}
function startF(all,same){F={q:(all?ids():due()).sort((a,b)=>S[a].b-S[b].b),f:0};F.n=F.q.length;if(same){render()}else go('flash')}
function rate(ok){const i=F.q.shift(),r=S[i];if(ok){r.b=Math.min(4,r.b+1);r.d=D+IV[r.b]}else{r.b=0;r.d=D;F.q.push(i)}F.f=0;act.add(D);save();render()}
function startQ(){const a=shuf(ids()).slice(0,5);Q={l:a.map((i,k)=>({i,f:k%2,o:shuf(shuf([...W.keys()].filter(x=>x!=i)).slice(0,3).concat(i))})),k:0,s:0,p:null};R.v=='quiz'?render():go('quiz')}
function ans(o){if(Q.p!=null)return;Q.p=o;const q=Q.l[Q.k];if(o==q.i)Q.s++;else{S[q.i].b=0;S[q.i].d=D}act.add(D);save();render(1)}
function stopLive(){if(LS){LS.getTracks().forEach(t=>t.stop());LS=null}}
async function startLive(){try{const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature&&!pp.allowsFeature('camera'))throw{name:'Policy'};if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw{name:'Unsupported'};LS=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});go('live');const v=$('vid');v.srcObject=LS;v.play().catch(()=>{})}catch(e){stopLive();const n=e&&e.name;C.err=(n=='Policy'||n=='NotAllowedError'||n=='SecurityError'?'หน้านี้ถูกจำกัดไม่ให้ใช้กล้องสด (ข้อจำกัดของแอปหรือเบราว์เซอร์ที่เปิดอยู่)':n=='NotFoundError'?'ไม่พบกล้องในอุปกรณ์นี้':'เปิดกล้องสดไม่ได้')+' (รหัส: '+(n||'unknown')+') วิธีที่ใช้ได้แน่นอน: เปิดแอปกล้องของมือถือถ่ายภาพ แล้วกลับมากด “เลือกรูปจากเครื่อง”';render()}}
function snap(){const v=$('vid');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(async b=>{const sm=await small(b),r=new FileReader();r.onload=()=>{C={img:r.result,blob:sm};H.pop();R={v:'cam'};render()};r.readAsDataURL(sm)},'image/jpeg',.85)}
render();
</script>
